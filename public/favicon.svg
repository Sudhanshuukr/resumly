<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117" />
      <stop offset="50%" stop-color="#161922" />
      <stop offset="100%" stop-color="#0B0D12" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#E2722C" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#E2722C" stop-opacity="0.1" />
    </linearGradient>

    <!-- Resumly Brand Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9248" />
      <stop offset="50%" stop-color="#E2722C" />
      <stop offset="100%" stop-color="#C8500C" />
    </linearGradient>

    <!-- White Spine Highlight -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Subtle Ambient Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2722C" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#E2722C" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter for Lettermark -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E2722C" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="108"
    fill="url(#bgGrad)"
    stroke="url(#borderGrad)"
    stroke-width="10"
  />

  <!-- Ambient Glow Behind Logo -->
  <circle cx="270" cy="256" r="180" fill="url(#centerGlow)" />

  <!-- Lettermark Group with Glow Filter -->
  <g filter="url(#glowShadow)">
    
    <!-- Left Vertical Spine (Crisp White/Platinum) -->
    <rect
      x="136"
      y="128"
      width="56"
      height="256"
      rx="14"
      fill="url(#whiteGrad)"
    />

    <!-- Upper Loop of the R (Crisp White/Platinum) -->
    <path
      d="M 180 128
         H 288
         C 342 128 376 160 376 210
         C 376 260 342 292 288 292
         H 180
         Z
         M 192 176
         H 280
         C 308 176 324 190 324 210
         C 324 230 308 244 280 244
         H 192
         Z"
      fill="url(#whiteGrad)"
      fill-rule="evenodd"
    />

    <!-- Dynamic Orange Accent Leg & Lightning Kick (Brand Orange) -->
    <path
      d="M 248 266
         C 264 266 278 272 290 284
         L 358 372
         C 364 380 374 384 384 384
         H 392
         C 398 384 402 376 398 370
         L 326 276
         L 348 276
         C 358 276 364 266 358 258
         L 320 216
         C 314 210 304 214 304 222
         L 304 246
         L 248 246
         Z"
      fill="url(#orangeGrad)"
    />

    <!-- Energy Spark Dot / Accent in Brand Orange -->
    <circle
      cx="376"
      cy="136"
      r="12"
      fill="url(#orangeGrad)"
    />
  </g>
</svg>
